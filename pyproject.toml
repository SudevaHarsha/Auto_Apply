[project]
name = "autoapply"
version = "0.1.0"
description = "Autonomous job-application agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "bcrypt",
    "PyJWT",
    "httpx",
    "pydantic",
    "cryptography",
    "PyMuPDF>=1.26.3",
    "pymupdf4llm>=0.0.27",
    "Jinja2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor/**"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# AGPL-3.0 byte-level file copy (D25/D22 I9 fidelity — must not be modified)
"backend/app/core_engine/pymupdf_rag_impl.py" = ["E", "F", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
exclude = ["vendor/"]
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in live provider smoke tests needing real API keys (.env.live, -Target test-integration-live)",
]
