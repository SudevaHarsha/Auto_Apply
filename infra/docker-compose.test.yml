name: autoapply-test

services:
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-autoapply}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-autoapply}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-autoapply}
    ports:
      - "${TEST_POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-autoapply}"]
      interval: 5s
      retries: 10
    volumes:
      - test_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@autoapply.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db_test

volumes:
  test_pgdata:
  pgadmin_data: